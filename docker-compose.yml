services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tenet
      POSTGRES_PASSWORD: tenet
      POSTGRES_DB: tenet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenet -d tenet"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
